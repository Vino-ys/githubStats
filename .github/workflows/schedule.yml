name: Update Gist Stats

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  update-productive-box:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxam2017/productive-box@master
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID_PRODUCTIVE }}
          TIMEZONE: Asia/Seoul

  update-stats-box:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run github-stats-box
        run: npx github-stats-box
        env:
          GH_PAT: ${{ secrets.GH_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID_STATS }}
